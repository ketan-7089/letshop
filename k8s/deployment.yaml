apiVersion: apps/v1
kind: Deployment
metadata:
  name: letshop-deployment
  labels:
    app: letshop
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: letshop
  template:
    metadata:
      labels:
        app: letshop
        tier: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: letshop-container
        image: ketan7089/letshop:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: SUPABASE_URL
          value: "https://vrzttugafdjspjlwwcvu.supabase.co"
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: letshop-secrets
              key: supabase-anon-key
              optional: true
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
