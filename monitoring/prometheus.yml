# ==============================================================================
# Prometheus Configuration for LetShop Observability Stack
# ==============================================================================
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  # 1. Scrape LetShop Application (/metrics) on host or container
  - job_name: 'letshop-application'
    metrics_path: '/metrics'
    scrape_interval: 2s
    static_configs:
      - targets: ['host.docker.internal:3000', 'localhost:3000']
        labels:
          app: 'letshop'
          tier: 'fullstack-web'
          environment: 'production'

  # 2. Scrape Node Exporter (Host/Container OS Metrics: CPU, RAM, Disk, Net)
  - job_name: 'node-exporter'
    scrape_interval: 2s
    static_configs:
      - targets: ['node-exporter:9100', 'localhost:9100']
        labels:
          role: 'linux-host'
          environment: 'production'

  # 3. Scrape Prometheus internal health
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
